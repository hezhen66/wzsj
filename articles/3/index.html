              : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
        var bg=null
        try{bg=JSON.parse(localStorage.getItem('isekai.home-background.light.v2')||'null')}catch(_){}

        document.documentElement.setAttribute('data-glass-background',t==='light'&&glass?'on':'off')
      })()
