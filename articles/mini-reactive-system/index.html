    <script>
      // 首屏防闪烁：挂载前按 localStorage / 系统偏好先设好主题
      ;(function () {
        var t
        try { t = localStorage.getItem('blog-theme') } catch (_) {}
        if (/^(?:\/wzsj)?\/articles\/[^/]+\/?$/.test(window.location.pathname)) t = 'light'
        if (t !== 'dark' && t !== 'light') {
          t =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        document.documentElement.setAttribute('data-theme', t)
        var bg=null
        try{bg=JSON.parse(localStorage.getItem('isekai.home-background.light.v2')||'null')}catch(_){}
        if(!bg){try{var old=JSON.parse(localStorage.getItem('isekai.home-background.light.v1')||'null');if(old)bg={enabled:old.blurred}}catch(_){} }
        var glass=bg&&typeof bg.enabled==='boolean'?bg.enabled:document.documentElement.getAttribute('data-glass-default')!=='off'
        document.documentElement.setAttribute('data-glass-background',t==='light'&&glass?'on':'off')
      })()
    </script>
